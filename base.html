<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ shop_name }} | QR Print{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar"><a class="brand" href="{{ url_for('upload_page') }}"><span class="brand-mark">SK</span><span>{{ shop_name }}<small>QR PRINT SYSTEM</small></span></a><a class="admin-link" href="{{ url_for('admin') }}">Admin</a></header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>© {{ shop_name }} · Digital Print & Document Services</footer>
</body></html>
