services:
  - type: web
    name: shree-karni-qr-print-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPI_ID
        sync: false
      - key: SHOP_NAME
        value: Shree Karni Computer Dalot
    disk:
      name: shree-karni-data
      mountPath: /var/data
      sizeGB: 1
